services:
  - type: web
    name: luke-agents
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # #31: run transcript-schema migrations as an explicit pre-deploy step (not lazily on
    # first request). No-op when DATABASE_URL is unset (dev/JSONL), so this never blocks a
    # non-Postgres deploy.
    preDeployCommand: sh -c '[ -n "$DATABASE_URL" ] && alembic upgrade head || echo "transcripts: DATABASE_URL unset — skipping migrations"'
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # #35: liveness — /health always-200s if the process is up, so a transient DB blip can't
    # trigger a restart loop. Dependency health is the separate /health/ready (503-capable) probe.
    healthCheckPath: /health
    envVars:
      # Pin Python to a version with prebuilt wheels for our deps. 3.14 has no
      # pydantic-core wheel yet and would try (and fail) to compile from Rust.
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Get a free key at https://console.groq.com/keys (email signup, no card)
      # and paste it in the Render dashboard (sync:false keeps it out of git).
      - key: GROQ_API_KEY
        sync: false
      # Best capability-per-dollar. Use moonshotai/kimi-k2-instruct for premium.
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL
        value: llama-3.3-70b-versatile
      # OpenAI brain — GPT-5 nano. Set OPENAI_API_KEY in the dashboard and
      # AGENTS_BRAIN=openai to switch to it (Groq wins by default otherwise).
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-nano
      # AGENTS_BRAIN selects the brain: groq | openai | gemini | ollama (sync:false
      # so you can flip it per service in the dashboard without a code change).
      - key: AGENTS_BRAIN
        sync: false
      # Per-user cap: 200 actions per 3 hours (10800s) to bound AI spend.
      - key: RATE_LIMIT_MAX
        value: "200"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "10800"
      # Shared rate-limit store (#27). REQUIRED for any multi-worker / multi-instance
      # run: without it the window is per-worker and the effective cap is multiplied
      # (and resets on every redeploy). Point at a Render Key Value (Redis) instance.
      # Unset → in-memory fallback (single-worker dev only). sync:false = set in dashboard.
      - key: REDIS_URL
        sync: false
      # Transcript store: set DATABASE_URL (the shared luke Postgres) to persist
      # turns for fine-tuning. Tables are created in the AGENTS_DB_SCHEMA schema.
      # Leave DATABASE_URL unset to disable durable recording (dev = JSONL files).
      - key: DATABASE_URL
        sync: false
      - key: AGENTS_DB_SCHEMA
        value: luke_agents
      - key: TRANSCRIPTS_ENABLED
        value: "true"
