# Alembic config for the luke-agents transcript schema (#31).
# The DB URL and target schema are resolved at runtime from DATABASE_URL and
# AGENTS_DB_SCHEMA in migrations/env.py — the same env the app reads — so there is
# deliberately no sqlalchemy.url here (nothing secret committed, no drift).
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
