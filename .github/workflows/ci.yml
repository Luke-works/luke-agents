# CI — the "robot" that checks every change before it counts.
# Runs automatically on every Pull Request and every push to develop.
# Green check = safe to merge. Red X = something's broken (it tells you what).
name: CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build & import check (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest fakeredis   # fakeredis backs the Redis rate-limiter test (#27)

      - name: Syntax check (compile everything)
        run: python -m compileall luke_agents main.py

      - name: Run tests
        # 'python -m pytest' puts the repo root on sys.path so `import luke_agents`
        # resolves. pytest also imports the app modules, so broken wiring fails here.
        run: python -m pytest -q

  migrations:
    name: Migrations apply cleanly (Postgres)
    runs-on: ubuntu-latest
    # #31: prove the transcript-schema migrations apply, reverse, and re-apply against a
    # real Postgres — the schema is no longer created by ad-hoc inline DDL alone.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: luke
          POSTGRES_PASSWORD: luke
          POSTGRES_DB: luke_agents
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U luke"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://luke:luke@localhost:5432/luke_agents
      AGENTS_DB_SCHEMA: luke_agents
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations (upgrade head)
        run: alembic upgrade head
      - name: Reversible (downgrade to base, then upgrade again)
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Idempotent (re-running head is a clean no-op)
        run: alembic upgrade head

  deps-audit:
    name: Dependency CVE audit (pip-audit)
    runs-on: ubuntu-latest
    # D7: GATING supply-chain gate. Fails the build if any dependency in requirements.txt has a
    # known CVE — EXCEPT a triaged baseline that is ignored below (so a pre-existing finding can't
    # block delivery, but any NEW vulnerable dep does). Complements the informational Trivy scan in
    # security-scan.yml with a hard gate scoped to our pinned Python deps.
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      # Ignored baseline = starlette 0.48.0 CVEs, pinned transitively by fastapi==0.116.2. Clearing
      # them needs a coordinated FastAPI upgrade (starlette >= 1.3.1) — a deliberate dependency bump
      # tracked separately, NOT this hygiene gate. Everything else must be clean. Drop an --ignore-vuln
      # line the moment that upgrade lands so the gate re-arms for that CVE.
      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281
