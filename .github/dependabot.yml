# Automated dependency update PRs. Security updates flow regardless of schedule.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    # Service deploys from develop, not main — open bump PRs there or they never ship (deploy drift).
    target-branch: "develop"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: "/"
    # Service deploys from develop, not main — open bump PRs there or they never ship (deploy drift).
    target-branch: "develop"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
